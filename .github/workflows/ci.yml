name: Validate export workflow

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Check syntax and JSON
        run: npm run check
      - name: Run unit and pipeline tests
        run: npm test
      - name: Run browser integration and example
        run: npm run test:integration
      - name: Retain example and diagnostic artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: basic-report-windows-node-${{ matrix.node }}
          path: outputs/ci-basic-report/
          if-no-files-found: warn
          retention-days: 7
